<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:Helvetica,Arial,sans-serif;color:#fff;overflow:hidden;
background:radial-gradient(circle at 20% 15%,#7c3aed 0,transparent 55%),radial-gradient(circle at 85% 85%,#ec4899 0,transparent 55%),#0f0a24;
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:140px 90px}
.tag{font-size:44px;letter-spacing:10px;font-weight:700;opacity:.9;margin-bottom:60px}
.play{width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.15);border:6px solid #fff;display:flex;align-items:center;justify-content:center;margin-bottom:90px}
.play i{border-left:96px solid #fff;border-top:60px solid transparent;border-bottom:60px solid transparent;margin-left:24px}
h1{font-size:150px;line-height:1.02;font-weight:900;margin-bottom:50px}
p{font-size:54px;opacity:.92;margin-bottom:110px}
.cta{background:#fff;color:#7c3aed;font-weight:800;font-size:56px;padding:40px 80px;border-radius:100px}
.arrow{font-size:80px;margin-top:70px}
</style></head><body>
<div class="tag">NUEVO VIDEO</div>
<div class="play"><i></i></div>
<h1>¡Ya está disponible!</h1>
<p>Miralo ahora en nuestro feed</p>
<div class="cta">👆 Tocá el link</div>
</body></html>
